# Publishes the package to nuget.org when a version tag is pushed:
#
#   git tag v0.1.0          # or v0.2.0-preview.1 for a pre-release
#   git push origin v0.1.0
#
# The version comes from the tag. Everything is built and tested again before anything is published.
#
# Authentication: nuget.org Trusted Publishing (OIDC) — no long-lived API key in the repository.
# One-time setup on nuget.org → your account → Trusted Publishing → add a policy:
#   repository owner/name = this repository, workflow file = release.yml, environment = nuget-org
# and set the repository variable NUGET_USER (Settings → Secrets and variables → Actions → Variables)
# to the nuget.org user (or organisation member) that owns the package.
name: Release

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/Averenium.Serilog.Sinks.RabbitMQ.Amqp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (expected v1.2.3 or v1.2.3-preview.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Releasing $version"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag must point to a commit on main"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Unit tests
        run: dotnet test --project tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.Tests -c Release --no-build

      - name: Integration tests (RabbitMQ in Docker)
        run: dotnet test --project tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.IntegrationTests -c Release --no-build

      # nuget.org does not resolve relative links in the package README: point them at this tag on GitHub.
      - name: Absolute links in the package README
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/"
          sed -E -i "s#\]\((docs/|AGENTS\.md|CHANGELOG\.md|LICENSE)#](${base}\1#g" README.md
          grep -n "](${base}" README.md | head -5

      - name: Pack
        run: >
          dotnet pack ${{ env.PROJECT }} -c Release --no-build -o artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageReleaseNotes="https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment (Settings → Environments) to approve every release by hand.
    environment: nuget-org
    permissions:
      contents: write   # GitHub release
      id-token: write   # nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: nuget.org login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed to the symbol server automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }}
