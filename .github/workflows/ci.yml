# Build and test on every push and pull request (standard check).
# Integration tests run against the current RabbitMQ minors only; see integration-tests.yml for the extended run.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props): a warning fails the build.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.Tests -c Release --no-build

      # Built once here; every broker-version job of the matrix only downloads and runs it.
      - name: Upload built integration tests
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests
          path: tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.IntegrationTests/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 1

      - name: Pack (smoke test)
        run: dotnet pack src/Averenium.Serilog.Sinks.RabbitMQ.Amqp -c Release --no-build -o artifacts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  # Standard check: the current RabbitMQ minors only. The extended run (every supported minor) is
  # integration-tests.yml — started by hand before rolling out a new feature, and by every release.
  integration:
    needs: build
    uses: ./.github/workflows/integration-tests.yml
    with:
      versions: '["4.3","4.4"]'
      artifact: integration-tests
