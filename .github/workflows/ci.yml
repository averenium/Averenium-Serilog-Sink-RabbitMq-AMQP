# Build and test on every push and pull request.
# Integration tests start RabbitMQ 4 with Testcontainers; GitHub's Ubuntu runners have Docker.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props): a warning fails the build.
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.Tests -c Release --no-build

      - name: Integration tests (RabbitMQ in Docker)
        run: dotnet test --project tests/Averenium.Serilog.Sinks.RabbitMQ.Amqp.IntegrationTests -c Release --no-build

      - name: Pack (smoke test)
        run: dotnet pack src/Averenium.Serilog.Sinks.RabbitMQ.Amqp -c Release --no-build -o artifacts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
          if-no-files-found: ignore
