# Local RabbitMQ 4 for the sample (samples/) and manual testing. Not used by the automated tests
# (they start their own brokers with Testcontainers).
#
#   docker compose up -d        # or: podman compose up -d
#   http://localhost:15672      # management UI, user/password below
#
# The credentials are for this throw-away local broker only. No healthcheck on purpose: the sink connects lazily
# and keeps retrying, so the application can start before the broker is ready.
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: serilog-amqp-sample-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sample
      RABBITMQ_DEFAULT_PASS: sample
    ports:
      - "5672:5672"     # AMQP 1.0 (and 0-9-1)
      - "15672:15672"   # management UI
